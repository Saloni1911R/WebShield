<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | WebShield</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #071321;
            color: #edf5ff;
            font-family: system-ui, Arial, sans-serif;
        }
        .card {
            width: min(360px, 85%);
            padding: 28px;
            background: #0c1b2d;
            border: 1px solid #203e5d;
            border-radius: 15px;
        }
        h1 { color: #34d399; }
        label { display: block; margin-top: 16px; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #355779;
            border-radius: 8px;
            background: #071321;
            color: white;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: 0;
            border-radius: 8px;
            background: #34d399;
            font-weight: bold;
            cursor: pointer;
        }
        a { color: #34d399; }
        .error { color: #fb7185; }
    </style>
</head>
<body>
    <main class="card">
        <h1>WebShield</h1>
        <p>Sign in to your account</p>

        {% if form.errors %}
            <p class="error">Username or password is incorrect.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">

            <label for="id_username">Username</label>
            {{ form.username }}

            <label for="id_password">Password</label>
            {{ form.password }}

            <button type="submit">Login</button>
        </form>
	<p>Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    </main>
</body>
</html>
